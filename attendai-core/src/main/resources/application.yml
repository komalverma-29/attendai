spring:
  application:
    name: attendai-core

  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/attendai}
    username: ${DB_USERNAME:attendai}
    password: ${DB_PASSWORD:attendai}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true
        default_batch_fetch_size: 20

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# JWT configuration — secret MUST be provided via environment variable JWT_SECRET
attendai:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry: 900
    refresh-token-expiry: 604800
    algorithm: HS256

  security:
    bcrypt-strength: 12
    max-sessions: 5
    reset-token-expiry: 3600
    allowed-origins:
      - ${CORS_ALLOWED_ORIGIN:http://localhost:3000}

  audit:
    trust-proxy: false
    max-details-length: 10000

  attendance:
    dedup-window-seconds: 300
    max-future-seconds: 60
    max-past-hours: 24

  file:
    storage-backend: local
    max-size-bytes: 10485760
    allowed-types: image/jpeg,image/png,image/webp,application/pdf
    presigned-url-max-ttl: 3600
    local-base-path: ${FILE_STORAGE_PATH:/var/attendai/files}

  notification:
    email-enabled: false
    push-enabled: false
    retry-max-attempts: 3
    retry-interval-seconds: 300
    email-from: noreply@attendai.app

  face:
    recognition-threshold: 0.85
    max-images-per-profile: 10
    liveness-check-enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
