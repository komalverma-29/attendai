spring:
  datasource:
    url: jdbc:h2:mem:attendai_school_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;NON_KEYWORDS=VALUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

attendai:
  jwt:
    secret: test-secret-key-that-is-at-least-32-characters-long!
    access-token-expiry: 900
    refresh-token-expiry: 604800
    algorithm: HS256

  security:
    bcrypt-strength: 4
    max-sessions: 5
    reset-token-expiry: 3600
    allowed-origins:
      - http://localhost:3000
