spring:
  application:
    name: attendai-core

  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/attendai}
    username: ${DB_USERNAME:attendai}
    password: ${DB_PASSWORD:attendai}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true
        default_batch_fetch_size: 20

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# JWT configuration — secret MUST be provided via environment variable JWT_SECRET
attendai:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry: 900
    refresh-token-expiry: 604800
    algorithm: HS256

  security:
    bcrypt-strength: 12
    max-sessions: 5
    reset-token-expiry: 3600
    allowed-origins:
      - ${CORS_ALLOWED_ORIGIN:http://localhost:3000}

  audit:
    trust-proxy: false
    max-details-length: 10000

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
